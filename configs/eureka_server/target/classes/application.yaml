spring:
  application:
    name: eureka-server
  profiles:
    active: development
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: 8761
  shutdown: graceful

eureka:
  client:
    registerWithEureka: false
    fetchRegistry: false
  server:
    # Standalone Eureka server optimization: do not wait 5 mins on startup if no peers exist
    wait-time-in-ms-when-sync-empty: 0
    # Update read-only cache frequently (3s instead of 30s) so re-registered VMs become visible immediately
    response-cache-update-interval-ms: 3000
    # Faster recalculation of expected renewals (5 mins instead of 15 mins) when instances reconnect
    renewal-threshold-update-interval-ms: 300000

management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus,metrics"
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name:eureka-server}
    export:
      prometheus:
        enabled: true


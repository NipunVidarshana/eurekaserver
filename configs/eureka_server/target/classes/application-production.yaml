server:
  tomcat:
    threads:
      max: 200
      min-spare: 20
    max-connections: 10000
    accept-count: 100
    connection-timeout: 20000ms
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 1024

eureka:
  server:
    # Protects instances from mass-eviction during transient network partitions/flaps
    enable-self-preservation: true
    # Percentage of renewals per minute required to remain out of self-preservation mode
    renewal-percent-threshold: 0.85
    # Eviction timer checks for expired leases every 60s
    eviction-interval-timer-in-ms: 60000
    # Dynamic recalculation rate of renewal threshold
    renewal-threshold-update-interval-ms: 300000
    # Rapid cache refresh for live discovery sync
    response-cache-update-interval-ms: 3000

logging:
  level:
    root: INFO
    org.springframework: WARN
    org.springframework.cloud.netflix.eureka: INFO
    com.netflix.eureka: INFO
    com.netflix.discovery: INFO

